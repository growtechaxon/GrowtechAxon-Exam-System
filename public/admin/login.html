<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | GrowtechAxon</title><link rel="stylesheet" href="/assets/style.css"></head><body>
<section class="card form-card" style="margin-top:100px"><div class="eyebrow">Restricted Area</div><h1>Admin Login</h1><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button id="login" class="btn btn-primary">Login</button><p id="msg"></p></section>
<script>document.getElementById('login').onclick=async()=>{const emailEl=document.getElementById('email'),passEl=document.getElementById('password'),msgEl=document.getElementById('msg');const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailEl.value.trim(),password:passEl.value})}),d=await r.json();if(!r.ok){msgEl.textContent=d.message;msgEl.style.color='#fda4af';return}localStorage.setItem('growtechAdminToken',d.token);location.href='/admin/dashboard.html'};</script></body></html>
