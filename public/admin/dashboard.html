<script>

/* =====================================================
   ADMIN TOKEN
===================================================== */

let token = localStorage.getItem("growtechAdminToken");

if(!token){
  location.href="/admin/login.html";
}


/* =====================================================
   API HELPER
===================================================== */

async function api(url, options = {}){

  token = localStorage.getItem("growtechAdminToken");

  if(!token){
    logout();
    throw new Error("Admin login required.");
  }

  const headers = {
    ...(options.headers || {}),
    "Authorization":"Bearer " + token
  };

  return fetch(url,{
    ...options,
    headers
  });
}


/* =====================================================
   DOWNLOAD PROTECTED PDF
===================================================== */

async function downloadPDF(url, filename){

  try{

    token = localStorage.getItem("growtechAdminToken");

    if(!token){
      logout();
      return;
    }

    const response = await fetch(url,{
      method:"GET",
      headers:{
        "Authorization":"Bearer " + token
      }
    });

    if(response.status === 401){

      localStorage.removeItem("growtechAdminToken");

      alert("Admin session expired. Please login again.");

      location.href="/admin/login.html";

      return;
    }

    if(!response.ok){

      let message = "PDF download failed.";

      try{

        const data = await response.json();

        message = data.message || message;

      }catch(e){}

      alert(message);

      return;
    }

    const blob = await response.blob();

    if(!blob || blob.size === 0){

      alert("PDF file is empty.");

      return;
    }

    const blobUrl = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = blobUrl;
    link.download = filename;

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(()=>{
      URL.revokeObjectURL(blobUrl);
    },1000);

  }catch(err){

    console.error("PDF download error:",err);

    alert(
      err.message ||
      "Unable to download PDF."
    );

  }

}


/* =====================================================
   DOWNLOAD RESULT
===================================================== */

function downloadResult(resultId){

  downloadPDF(
    "/api/admin/results/" +
    encodeURIComponent(resultId) +
    "/pdf",

    "GrowtechAxon-Result-" +
    resultId +
    ".pdf"
  );

}


/* =====================================================
   DOWNLOAD CERTIFICATE
===================================================== */

function downloadCertificate(certificateId){

  if(!certificateId){

    alert("Certificate ID is not available.");

    return;
  }

  downloadPDF(
    "/api/admin/certificates/" +
    encodeURIComponent(certificateId) +
    "/pdf",

    "GrowtechAxon-Certificate-" +
    certificateId +
    ".pdf"
  );

}


/* =====================================================
   LOAD RESULTS
===================================================== */

async function load(){

  try{

    const q =
      document
        .getElementById("search")
        .value
        .trim();

    const r = await api(
      "/api/admin/results?q=" +
      encodeURIComponent(q)
    );

    if(r.status === 401){

      logout();

      return;
    }

    let data;

    try{

      data = await r.json();

    }catch(err){

      throw new Error(
        "Server returned an invalid response."
      );

    }

    if(!r.ok){

      throw new Error(
        data.message ||
        "Unable to load results."
      );

    }


    document.getElementById("rows").innerHTML =

      data.map(x => `

        <tr>

          <td>

            <b>${esc(x.candidateName)}</b>

            <br>

            <span class="muted">
              ${esc(x.email)}
            </span>

          </td>


          <td>
            ${esc(x.testTitle)}
          </td>


          <td>

            ${x.score}/${x.totalQuestions}

            <br>

            <span class="muted">
              ${x.percentage}%
            </span>

          </td>


          <td>

            <span class="${
              x.passed
              ? "status-pass"
              : "status-fail"
            }">

              ${
                x.passed
                ? "PASSED"
                : "NOT PASSED"
              }

            </span>

          </td>


          <td>

            ${
              x.certificateId

              ? `

                <strong class="certificate-id">
                  ${esc(x.certificateId)}
                </strong>

              `

              : `

                <span class="muted">
                  No Certificate
                </span>

              `
            }

          </td>


          <td>

            <button
              class="btn btn-ghost"
              onclick="view('${escAttr(x.resultId)}')"
            >
              View
            </button>

          </td>

        </tr>

      `).join("")

      ||

      `

        <tr>

          <td colspan="6">
            No results found.
          </td>

        </tr>

      `;


    document.getElementById("total")
      .textContent = data.length;


    document.getElementById("passed")
      .textContent =
      data.filter(x => x.passed).length;


    document.getElementById("certs")
      .textContent =
      data.filter(x => x.certificateId).length;


    const today =
      new Date().toDateString();


    document.getElementById("today")
      .textContent =

      data.filter(x => {

        if(!x.submittedAt){
          return false;
        }

        return (
          new Date(x.submittedAt)
            .toDateString() === today
        );

      }).length;

  }

  catch(err){

    console.error(err);

    alert(
      err.message ||
      "Unable to load results."
    );

  }

}


/* =====================================================
   VIEW RESULT
===================================================== */

async function view(id){

  try{

    const r = await api(
      "/api/admin/results/" +
      encodeURIComponent(id)
    );

    if(r.status === 401){

      logout();

      return;
    }

    let d;

    try{

      d = await r.json();

    }catch(err){

      throw new Error(
        "Server returned an invalid response."
      );

    }

    if(!r.ok){

      return alert(
        d.message ||
        "Unable to load result."
      );

    }

    const result = d.result;
    const certificate = d.certificate;

    renderResult(result,certificate);

  }

  catch(err){

    console.error(err);

    alert(
      err.message ||
      "Unable to open result."
    );

  }

}


/* =====================================================
   RENDER RESULT
===================================================== */

function renderResult(result,certificate){

  let certificateHtml = "";


  /* =================================================
     CERTIFICATE FOUND
  ================================================= */

  if(certificate){

    certificateHtml = `

      <div class="detail-box">

        <small>Certificate ID</small>

        <strong class="certificate-id">
          ${esc(certificate.certificateId)}
        </strong>

      </div>


      <div class="detail-box">

        <small>Certificate Status</small>

        <strong class="${
          certificate.status === "valid" ||
          certificate.status === "active"
          ? "status-pass"
          : "status-fail"
        }">

          ${esc(
            certificate.status ||
            "Unknown"
          )}

        </strong>

      </div>


      <div class="detail-box">

        <small>Issue Date</small>

        <strong>

          ${
            certificate.issueDate

            ? new Date(
                certificate.issueDate
              ).toLocaleDateString()

            : "—"
          }

        </strong>

      </div>


      <div class="detail-box">

        <small>Grade</small>

        <strong>

          ${esc(
            certificate.grade ||
            "—"
          )}

        </strong>

      </div>

    `;

  }


  /* =================================================
     CERTIFICATE NOT FOUND
  ================================================= */

  else{

    certificateHtml = `

      <div class="detail-box">

        <small>Certificate</small>

        ${
          result.passed

          ? `

            <strong class="status-fail">
              Certificate not generated
            </strong>

            <br><br>

            <button
              id="generateCertificateBtn"
              class="btn btn-primary"
              type="button"
              onclick="generateCertificate(
                '${escAttr(result.resultId)}',
                this
              )"
            >
              Generate Certificate
            </button>

          `

          : `

            <strong class="status-fail">
              Not eligible — candidate did not pass
            </strong>

          `
        }

      </div>

    `;

  }


  /* =================================================
     RESULT DETAILS
  ================================================= */

  const html = `

    <div class="result-detail">


      <div class="detail-box">

        <small>Candidate Name</small>

        <strong>
          ${esc(result.candidateName)}
        </strong>

      </div>


      <div class="detail-box">

        <small>Email</small>

        <strong>
          ${esc(result.email)}
        </strong>

      </div>


      <div class="detail-box">

        <small>Phone</small>

        <strong>
          ${esc(result.phone || "—")}
        </strong>

      </div>


      <div class="detail-box">

        <small>Result ID</small>

        <strong>
          ${esc(result.resultId)}
        </strong>

      </div>


      <div class="detail-box">

        <small>Test</small>

        <strong>
          ${esc(result.testTitle)}
        </strong>

      </div>


      <div class="detail-box">

        <small>Score</small>

        <strong>
          ${result.score}/${result.totalQuestions}
        </strong>

      </div>


      <div class="detail-box">

        <small>Percentage</small>

        <strong>
          ${result.percentage}%
        </strong>

      </div>


      <div class="detail-box">

        <small>Status</small>

        <strong class="${
          result.passed
          ? "status-pass"
          : "status-fail"
        }">

          ${
            result.passed
            ? "PASSED"
            : "NOT PASSED"
          }

        </strong>

      </div>


      <div class="detail-box">

        <small>Submission Type</small>

        <strong>
          ${esc(result.submissionType || "—")}
        </strong>

      </div>


      <div class="detail-box">

        <small>Submitted At</small>

        <strong>

          ${
            result.submittedAt

            ? new Date(
                result.submittedAt
              ).toLocaleString()

            : "—"
          }

        </strong>

      </div>


      ${certificateHtml}


    </div>


    <div class="actions">


      <button
        class="btn btn-primary download-btn"
        type="button"
        onclick="downloadResult(
          '${escAttr(result.resultId)}'
        )"
      >
        Download Result PDF
      </button>


      ${
        certificate

        ? `

          <button
            class="btn btn-gold download-btn"
            type="button"
            onclick="downloadCertificate(
              '${escAttr(certificate.certificateId)}'
            )"
          >
            Download Certificate
          </button>


          <button
            class="btn btn-ghost"
            type="button"
            onclick="editCertById(
              '${escAttr(certificate.certificateId)}'
            )"
          >
            Edit Certificate
          </button>


          <button
            class="btn btn-ghost"
            type="button"
            onclick="openWhatsApp(
              '${escAttr(result.candidateName)}',
              '${escAttr(certificate.certificateId)}'
            )"
          >

        `

        : ""

      }

  `;


  document.getElementById("detail")
    .innerHTML = html;


  document.getElementById("modal")
    .classList.add("show");

}


/* =====================================================
   GENERATE CERTIFICATE
===================================================== */

async function generateCertificate(resultId,button){

  if(!resultId){

    alert("Result ID missing.");

    return;
  }

  try{

    if(button){

      button.disabled = true;
      button.innerText = "Generating...";
    }


    const r = await api(
      "/api/admin/certificates/generate/" +
      encodeURIComponent(resultId),
      {
        method:"POST"
      }
    );


    if(r.status === 401){

      logout();

      return;
    }


    let data;

    try{

      data = await r.json();

    }catch(err){

      throw new Error(
        "Server returned an invalid response."
      );

    }


    if(!r.ok){

      throw new Error(
        data.message ||
        "Certificate generation failed."
      );

    }


    alert(
      "Certificate generated successfully!\n\n" +
      "Certificate ID: " +
      data.certificateId
    );


    await load();

    await view(resultId);

  }

  catch(err){

    console.error(
      "Generate certificate error:",
      err
    );

    alert(
      err.message ||
      "Unable to generate certificate."
    );


    if(button){

      button.disabled = false;
      button.innerText =
        "Generate Certificate";

    }

  }

}


/* =====================================================
   GET CERTIFICATE FOR EDIT
===================================================== */

async function editCertById(certificateId){

  if(!certificateId){

    alert("Certificate ID missing.");

    return;
  }

  try{

    const r = await api(
      "/api/admin/results"
    );

    if(r.status === 401){

      logout();

      return;
    }

    const results = await r.json();

    if(!r.ok){

      throw new Error(
        results.message ||
        "Unable to load certificate."
      );

    }


    const result = results.find(
      x => x.certificateId === certificateId
    );


    if(!result){

      alert(
        "Certificate result record not found."
      );

      return;
    }


    const detailResponse = await api(
      "/api/admin/results/" +
      encodeURIComponent(result.resultId)
    );


    const detailData =
      await detailResponse.json();


    if(!detailResponse.ok){

      throw new Error(
        detailData.message ||
        "Unable to load certificate details."
      );

    }


    if(!detailData.certificate){

      alert(
        "Certificate not found."
      );

      return;
    }


    editCert(detailData.certificate);

  }

  catch(err){

    console.error(
      "Edit certificate error:",
      err
    );

    alert(
      err.message ||
      "Unable to open certificate editor."
    );

  }

}

/* =====================================================
   SAVE CERTIFICATE
===================================================== */

async function saveCert(id){

  try{

    const name =
      document
        .getElementById("ec_name")
        .value
        .trim();


    const testTitle =
      document
        .getElementById("ec_test")
        .value
        .trim();


    const percentage =
      Number(
        document
          .getElementById("ec_pct")
          .value
      );


    const grade =
      document
        .getElementById("ec_grade")
        .value
        .trim();


    const status =
      document
        .getElementById("ec_status")
        .value;


    const signatoryName =
      document
        .getElementById("ec_sign")
        .value
        .trim();


    const signatoryDesignation =
      document
        .getElementById("ec_desig")
        .value
        .trim();


    if(!name){

      alert("Candidate name is required.");

      return;
    }


    if(!testTitle){

      alert("Test title is required.");

      return;
    }


    if(
      Number.isNaN(percentage) ||
      percentage < 0 ||
      percentage > 100
    ){

      alert(
        "Percentage must be between 0 and 100."
      );

      return;
    }


    const body = {

      candidateName:name,

      testTitle:testTitle,

      percentage:percentage,

      grade:grade,

      status:status,

      signatoryName:signatoryName,

      signatoryDesignation:
        signatoryDesignation

    };


    const r = await api(
      "/api/admin/certificates/" +
      encodeURIComponent(id),
      {
        method:"PUT",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(body)
      }
    );


    if(r.status === 401){

      logout();

      return;
    }


    const d =
      await r.json();


    if(!r.ok){

      throw new Error(
        d.message ||
        "Certificate update failed."
      );

    }


    alert(
      "Certificate updated successfully."
    );


    await load();


    const resultId =
      await findResultByCert(id);


    if(resultId){

      await view(resultId);

    }else{

      closeModal();

    }

  }

  catch(err){

    console.error(
      "Save certificate error:",
      err
    );

    alert(
      err.message ||
      "Certificate update failed."
    );

  }

}


/* =====================================================
   FIND RESULT BY CERTIFICATE
===================================================== */

async function findResultByCert(id){

  try{

    const r =
      await api(
        "/api/admin/results"
      );


    if(r.status === 401){

      logout();

      return "";
    }


    if(!r.ok){

      return "";
    }


    const data =
      await r.json();


    const found =
      data.find(
        x =>
          x.certificateId === id
      );


    return found
      ? found.resultId
      : "";

  }

  catch(err){

    console.error(err);

    return "";

  }

}


/* =====================================================

function openWhatsApp(
  name,
  certificateId
){

  const text =
    "GrowtechAxon result/certificate ready for " +
    name +
    ". Certificate ID: " +
    certificateId;


  const url =
    "https://wa.me/?text=" +
    encodeURIComponent(text);


  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}

function logout(){

  localStorage.removeItem(
    "growtechAdminToken"
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(s){

  return String(s ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}


function escAttr(s){

  return esc(s);

}
